<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પ્રાથમિક શાળા ખરોડ - 3D ઘન આકારો</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #eef2f7; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { background-color: #1a5276; color: white; width: 100%; text-align: center; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; width: 100%; max-width: 1100px; }
        #viewer-container { background: radial-gradient(#ffffff, #d5dbdb); border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 450px; height: 450px; position: relative; overflow: hidden; border: 3px solid #1a5276; display: flex; justify-content: center; align-items: center; }
        #controls { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
        input { width: 100%; padding: 10px; border: 2px solid #d5dbdb; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        select { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #3498db; margin-bottom: 15px; cursor: pointer; }
        .btn-check { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        #pause-btn { position: absolute; bottom: 15px; right: 15px; padding: 10px 20px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 20px; cursor: pointer; z-index: 10; }
        #result-message { margin-top: 15px; font-weight: bold; text-align: center; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4efdf; color: #145a32; }
        .error { background-color: #fadbd8; color: #7b241c; }
        #loading-msg { color: #1a5276; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">પ્રાથમિક શાળા ખરોડ</h1>
    <h2 style="margin:5px 0; font-weight: normal; font-size: 1.2rem;">ધોરણ 7: ઘન આકારોનું પ્રત્યક્ષીકરણ</h2>
</header>

<div class="container">
    <div id="viewer-container">
        <div id="loading-msg">આકાર લોડ થઈ રહ્યો છે... (ઇન્ટરનેટ ચાલુ રાખો)</div>
        <button id="pause-btn" onclick="toggleRotation()">થોભો (Pause)</button>
    </div>

    <div id="controls">
        <label>આકાર પસંદ કરો:</label>
        <select id="shapeSelect" onchange="changeShape()">
            <option value="cube">ઘન (Cube)</option>
            <option value="cuboid">લંબઘન (Cuboid)</option>
            <option value="triPrism">ત્રિકોણીય પ્રિઝમ</option>
            <option value="triPyramid">ત્રિકોણીય પિરામિડ</option>
            <option value="sqPyramid">ચતુષ્કોણીય પિરામિડ</option>
        </select>
        <div class="input-group"><label>ફલક (F):</label><input type="number" id="inputF"></div>
        <div class="input-group"><label>શિરોબિંદુ (V):</label><input type="number" id="inputV"></div>
        <div class="input-group"><label>ધાર (E):</label><input type="number" id="inputE"></div>
        <button class="btn-check" onclick="checkAnswer()">જવાબ તપાસો</button>
        <div id="result-message"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // જો લાઈબ્રેરી લોડ ન થાય તો મેસેજ બતાવશે
    window.onload = function() {
        if (typeof THREE === 'undefined') {
            document.getElementById('loading-msg').innerHTML = "<span style='color:red;'>ભૂલ: ઇન્ટરનેટ બંધ હોવાથી આકારો દેખાશે નહીં. કૃપા કરી ઇન્ટરનેટ ચાલુ કરી પેજ રિફ્રેશ કરો.</span>";
        } else {
            document.getElementById('loading-msg').style.display = 'none';
            init3D();
        }
    };

    let scene, camera, renderer, currentMesh, edges, isRotating = true;
    const container = document.getElementById('viewer-container');

    const shapeData = {
        cube: { f: 6, v: 8, e: 12, color: 0xe74c3c },
        cuboid: { f: 6, v: 8, e: 12, color: 0x27ae60 },
        triPrism: { f: 5, v: 6, e: 9, color: 0x3498db },
        triPyramid: { f: 4, v: 4, e: 6, color: 0xf1c40f },
        sqPyramid: { f: 5, v: 5, e: 8, color: 0x9b59b6 }
    };

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, 1, 0.1, 1000);
        camera.position.z = 3.5;
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(450, 450);
        container.appendChild(renderer.domElement);
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));
        changeShape();
        animate();
    }

    function changeShape() {
        if (currentMesh) scene.remove(currentMesh);
        if (edges) scene.remove(edges);
        const type = document.getElementById('shapeSelect').value;
        const data = shapeData[type];
        let geom;
        if(type === 'cube') geom = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        else if(type === 'cuboid') geom = new THREE.BoxGeometry(2.2, 1.2, 1.2);
        else if(type === 'triPrism') geom = new THREE.CylinderGeometry(1, 1, 1.8, 3);
        else if(type === 'triPyramid') geom = new THREE.ConeGeometry(1.2, 1.8, 3);
        else if(type === 'sqPyramid') geom = new THREE.ConeGeometry(1.3, 1.8, 4);

        currentMesh = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ color: data.color, transparent: true, opacity: 0.8 }));
        edges = new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: 0x000000 }));
        scene.add(currentMesh);
        scene.add(edges);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (isRotating && currentMesh) {
            currentMesh.rotation.y += 0.01;
            edges.rotation.y += 0.01;
        }
        renderer.render(scene, camera);
    }

    function toggleRotation() {
        isRotating = !isRotating;
        document.getElementById('pause-btn').innerText = isRotating ? "થોભો (Pause)" : "ચાલુ કરો (Play)";
    }

    function checkAnswer() {
        const type = document.getElementById('shapeSelect').value;
        const correct = shapeData[type];
        const f = parseInt(document.getElementById('inputF').value);
        const v = parseInt(document.getElementById('inputV').value);
        const e = parseInt(document.getElementById('inputE').value);
        const msg = document.getElementById('result-message');
        if (f === correct.f && v === correct.v && e === correct.e) {
            msg.innerText = "શાબાશ! સાચો જવાબ છે. 🌟";
            msg.className = "success";
        } else {
            msg.innerText = "ખોટું છે, ફરી પ્રયત્ન કરો! 🛑";
            msg.className = "error";
        }
    }
</script>
</body>
</html>
